# ==============================================
# Nginx Reverse Proxy - TBU Schedule Management
# ==============================================
# Tất cả traffic đi qua 1 cổng duy nhất (80/443)
# Nginx route tới từng service nội bộ

# --- HTTP: Redirect tất cả sang HTTPS ---
server {
    listen 80;
    server_name lichcongtactbu.site www.lichcongtactbu.site;

    # Certbot challenge (cho Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Main server block ---
server {
    listen 443 ssl http2;
    server_name lichcongtactbu.site www.lichcongtactbu.site;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/lichcongtactbu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lichcongtactbu.site/privkey.pem;

    # Docker internal DNS resolver - tự re-resolve khi container đổi IP
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:3000;
    set $tts_upstream http://python_tts:8003;

    # SSL Settings (modern config)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (cho audio files, etc.)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    # ============================================
    # 1. Frontend (Static files từ Vite build)
    # ============================================
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================
    # 2. Backend API → Express (:3000)
    # ============================================
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ============================================
    # 3. Uploads (Audio TTS, files) → Backend
    # ============================================
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache uploaded files
        expires 30d;
        add_header Cache-Control "public";
    }

    # ============================================
    # 4. TTS Service → Python TTS (:8003)
    # ============================================
    location /tts/ {
        rewrite ^/tts/(.*) /$1 break;
        proxy_pass $tts_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ============================================
    # 5. WebSocket Support (cho realtime updates)
    # ============================================
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }
}
