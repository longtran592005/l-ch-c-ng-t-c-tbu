version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tbu_postgres
    environment:
      POSTGRES_DB: tbu_schedule_db
      POSTGRES_USER: prisma_user
      POSTGRES_PASSWORD: "StrongPassword123!"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tbu_backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://prisma_user:StrongPassword123!@postgres:5432/tbu_schedule_db
      - JWT_SECRET=your-super-secret-jwt-token-at-least-32-chars
      - JWT_REFRESH_SECRET=your-super-secret-jwt-refresh-token-at-least-32-chars
      - PORT=3001
      - CORS_ORIGIN=http://localhost:8080
    depends_on:
      - postgres
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./backend/prisma:/usr/src/app/prisma

volumes:
  postgres_data: