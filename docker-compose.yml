# ==============================================
# TBU Schedule Management - Docker Compose
# ==============================================
# Triển khai toàn bộ hệ thống với 1 lệnh:
#   docker compose up -d --build
#
# Services:
#   - nginx:      Reverse proxy (port 80/443)
#   - frontend:   Vite React build (static files)
#   - backend:    Express API + Prisma
#   - postgres:   PostgreSQL 16
#   - python_tts: Edge-TTS service

services:
  # ============================================
  # 1. Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: tbu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx config (ban đầu dùng nossl, sau khi có cert chuyển sang nginx.conf)
      - ./nginx/nginx.nossl.conf:/etc/nginx/conf.d/default.conf:ro
      # Frontend static files (copy từ frontend build)
      - frontend_build:/usr/share/nginx/html:ro
      # SSL certificates (Let's Encrypt)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - tbu_network

  # ============================================
  # 2. Certbot (SSL certificate manager)
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: tbu_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Chỉ chạy khi cần renew cert
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - tbu_network

  # ============================================
  # 3. Frontend (Build static files)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_PORT=3000
    container_name: tbu_frontend
    volumes:
      - frontend_build:/usr/share/nginx/html

  # ============================================
  # 4. Backend API (Express + Prisma)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tbu_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-prisma_user}:${POSTGRES_PASSWORD:-StrongPassword123!}@postgres:5432/${POSTGRES_DB:-tbu_schedule_db}
      - JWT_SECRET=${JWT_SECRET:-tbu_schedule_jwt_secret_key_very_strong_2024_prod}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-tbu_schedule_jwt_refresh_secret_key_very_strong_2024_prod}
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-https://lichcongtactbu.site}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama3-70b-8192}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY:-}
      - POLLINATIONS_BASE_URL=${POLLINATIONS_BASE_URL:-https://gen.pollinations.ai}
      - POLLINATIONS_MODEL=${POLLINATIONS_MODEL:-openai}
      - POLLINATIONS_STT_MODEL=${POLLINATIONS_STT_MODEL:-whisper-large-v3}
      - TTS_SERVICE_URL=http://python_tts:8003
    volumes:
      - backend_uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tbu_network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ============================================
  # 5. PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tbu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbu_schedule_db}
      POSTGRES_USER: ${POSTGRES_USER:-prisma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StrongPassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tbu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prisma_user} -d ${POSTGRES_DB:-tbu_schedule_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # 6. Python TTS Service (Edge-TTS)
  # ============================================
  python_tts:
    build:
      context: ./python_tts_service
      dockerfile: Dockerfile
    container_name: tbu_python_tts
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - TTS_OUTPUT_DIR=/app/uploads/tts
    networks:
      - tbu_network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local
  frontend_build:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  tbu_network:
    driver: bridge